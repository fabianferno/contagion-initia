# nginx site config for the Contagion BACKEND on EC2.
# The client is on Vercel; this box only runs the pm2 game/faucet server
# on :3001. nginx terminates TLS for contagion.crevn.xyz and proxies
# everything (HTTP /api + WebSocket /ws) to the local server.
#
# Install (Amazon Linux 2023):
#   sudo dnf install -y nginx
#   sudo cp contagion-frontend/deploy/nginx-contagion.conf /etc/nginx/conf.d/contagion.conf
#   sudo nginx -t && sudo systemctl enable --now nginx
# Then issue TLS (auto-rewrites this file to add the 443 block + redirect):
#   sudo dnf install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d contagion.crevn.xyz
#
# DNS: point an A record for contagion.crevn.xyz at this instance's public IP
# (or Elastic IP) before running certbot.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name contagion.crevn.xyz;

    # WebSocket game layer (client connects to wss://contagion.crevn.xyz/ws)
    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # long-lived game sockets
        proxy_send_timeout 3600s;
    }

    # HTTP API: /api/faucet, /api/balance/* (CORS is set by the server)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health/root
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }
}
